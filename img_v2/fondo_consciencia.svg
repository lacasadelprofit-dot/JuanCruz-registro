<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Fondo del inicio de Consciencia en Búzios (inspirado en el logo): resplandor, flor de la vida,
       puntos de luz del tercer ojo y del corazón, y un cielo con constelaciones. Se usa con opacidad baja. -->
  <defs>
    <radialGradient id="sol" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#F0D58E" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#D9B55E" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D9B55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="punto" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#F0D58E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="500" cy="500" r="470" fill="url(#sol)"/>
  <!-- rayos -->
  <g stroke="#F0D58E" stroke-opacity=".22" stroke-width="1.2">
    <line x1="500" y1="500" x2="500" y2="20"/><line x1="500" y1="500" x2="980" y2="500"/><line x1="500" y1="500" x2="500" y2="980"/><line x1="500" y1="500" x2="20" y2="500"/>
    <line x1="500" y1="500" x2="840" y2="160"/><line x1="500" y1="500" x2="840" y2="840"/><line x1="500" y1="500" x2="160" y2="840"/><line x1="500" y1="500" x2="160" y2="160"/>
    <line x1="500" y1="500" x2="684" y2="56"/><line x1="500" y1="500" x2="944" y2="316"/><line x1="500" y1="500" x2="944" y2="684"/><line x1="500" y1="500" x2="684" y2="944"/>
    <line x1="500" y1="500" x2="316" y2="944"/><line x1="500" y1="500" x2="56" y2="684"/><line x1="500" y1="500" x2="56" y2="316"/><line x1="500" y1="500" x2="316" y2="56"/>
  </g>
  <!-- flor de la vida (19 círculos) -->
  <g fill="none" stroke="#F0D58E" stroke-width="2" stroke-opacity=".75">
    <circle cx="500" cy="500" r="100"/>
    <circle cx="500" cy="400" r="100"/><circle cx="500" cy="600" r="100"/>
    <circle cx="586.6" cy="450" r="100"/><circle cx="586.6" cy="550" r="100"/>
    <circle cx="413.4" cy="450" r="100"/><circle cx="413.4" cy="550" r="100"/>
    <circle cx="500" cy="300" r="100"/><circle cx="500" cy="700" r="100"/>
    <circle cx="673.2" cy="400" r="100"/><circle cx="673.2" cy="600" r="100"/>
    <circle cx="326.8" cy="400" r="100"/><circle cx="326.8" cy="600" r="100"/>
    <circle cx="586.6" cy="350" r="100"/><circle cx="586.6" cy="650" r="100"/>
    <circle cx="413.4" cy="350" r="100"/><circle cx="413.4" cy="650" r="100"/>
    <circle cx="673.2" cy="500" r="100"/><circle cx="326.8" cy="500" r="100"/>
    <circle cx="500" cy="500" r="300" stroke-width="2.5"/>
    <circle cx="500" cy="500" r="318" stroke-width="1" stroke-opacity=".5"/>
  </g>
  <!-- tercer ojo y corazón -->
  <circle cx="500" cy="420" r="46" fill="url(#punto)"/>
  <circle cx="500" cy="560" r="38" fill="url(#punto)" opacity=".9"/>
  <!-- cielo: estrellas y constelaciones -->
  <g fill="#FFF3C4">
    <circle cx="120" cy="140" r="3"/><circle cx="190" cy="105" r="2.2"/><circle cx="250" cy="160" r="2.6"/><circle cx="215" cy="230" r="2"/>
    <circle cx="820" cy="120" r="2.6"/><circle cx="880" cy="190" r="2"/><circle cx="930" cy="130" r="2.4"/>
    <circle cx="90" cy="420" r="1.8"/><circle cx="900" cy="420" r="1.8"/><circle cx="60" cy="760" r="2"/><circle cx="950" cy="780" r="2"/>
  </g>
  <g stroke="#F0D58E" stroke-opacity=".45" stroke-width="1">
    <polyline fill="none" points="120,140 190,105 250,160 215,230"/>
    <polyline fill="none" points="820,120 930,130 880,190 820,120"/>
  </g>
</svg>
