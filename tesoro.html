<style>
:root{
  --bg:#FAF7F2;--card:#FFFFFF;--card2:#F4F0EA;--border:#E8DFD3;
  --terra:#C17A48;--terra-d:#9A5C30;--terra-l:#F0E4D6;--text:#1C1200;--muted:#7A6E60;
  --cream:#FBF1E4;--gold:#F1C778;--ok:#4C8B5A;--err:#A83C3C;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 48px;}
a{color:inherit;}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 18px;}
.brand{font-weight:800;font-size:15px;color:var(--terra-d);text-decoration:none;}
.brand span{color:var(--terra);}
.langs{display:flex;gap:6px;}
.lang{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:#fff;color:var(--text);font:700 12px 'DM Sans',sans-serif;cursor:pointer;}
.lang.on{background:var(--terra-d);border-color:var(--terra-d);color:#fff;}

.cab{text-align:center;margin-bottom:20px;}
.kicker{display:inline-block;padding:5px 14px;border-radius:20px;background:var(--terra-l);color:var(--terra-d);font-size:12px;font-weight:700;margin-bottom:12px;}
.cab h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(32px,9vw,40px);line-height:1.08;}
.cab h1 em{font-style:normal;color:var(--terra);}
.cab p{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.5;}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:14px;}
.sec-t{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:12px;}
.ico{width:1em;height:1em;vertical-align:-.15em;flex:none;}

/* sticker */
.st-preg{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:27px;line-height:1.3;text-align:center;margin:4px 0 14px;}
.chip{display:table;margin:0 auto 16px;padding:6px 16px;border-radius:20px;background:var(--terra-l);color:var(--terra-d);font-size:13px;font-weight:700;}
.pasos{background:var(--card2);border-radius:14px;padding:14px 14px 14px 32px;font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:16px;}
.pasos b{color:var(--text);}
.fg label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;}
.fg input[type=text]{width:100%;padding:14px;border:1.5px solid var(--border);border-radius:12px;font:15px 'DM Sans',sans-serif;outline:none;}
.fg input[type=text]:focus{border-color:var(--terra);}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45;margin:14px 0 16px;cursor:pointer;}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--terra-d);}
.check a{color:var(--terra-d);}
.nota{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 8px 18px;}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;font:800 15px 'DM Sans',sans-serif;cursor:pointer;text-align:center;text-decoration:none;transition:background .2s,transform .15s;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.55;cursor:wait;}
.btn-terra{background:var(--terra-d);color:#fff;}
.btn-terra:hover{background:#7E3815;}
.btn-borde{background:transparent;color:var(--terra-d);border:1.5px solid var(--terra-d);}
.link-c{display:block;text-align:center;font-size:13.5px;font-weight:700;color:var(--terra-d);margin-top:16px;}
.msg{border-radius:14px;padding:14px;font-size:14px;line-height:1.55;text-align:center;}
.msg-ok{background:rgba(76,139,90,.1);border:1px solid rgba(76,139,90,.3);color:var(--ok);}
.msg-err{background:rgba(168,60,60,.07);border:1px solid rgba(168,60,60,.25);color:var(--err);}
.recordar{display:flex;gap:10px;align-items:flex-start;background:var(--terra-l);border-radius:14px;padding:14px;font-size:13.5px;color:var(--terra-d);line-height:1.5;margin:12px 0;font-weight:600;text-align:left;}
.recordar svg{width:20px;height:20px;flex:none;margin-top:1px;}
.error-campo{border-color:var(--err)!important;}

/* ruleta de premios */
.rp{position:relative;width:min(290px,100%);aspect-ratio:1;margin:4px auto 18px;}
.rp>svg{width:100%;height:100%;display:block;overflow:visible;}
#rpRot{transform-origin:150px 150px;transition:transform 4s cubic-bezier(.15,.75,.12,1);}
.rp-pin{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid var(--terra-d);z-index:2;}
.rp-txt{font-family:'DM Sans',sans-serif;font-weight:700;}

/* tablero */
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.modo{border-radius:20px;padding:16px;text-decoration:none;display:block;}
.modo h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:23px;line-height:1.1;margin-bottom:8px;}
.modo p{font-size:13px;line-height:1.45;}
.modo-a{background:var(--terra-d);color:#fff;}
.modo-a p{color:rgba(255,255,255,.85);}
.modo-b{background:var(--terra-l);border:1px solid #E2C9AE;color:var(--text);}
.modo-b p{color:var(--muted);}
.contador{display:flex;align-items:center;gap:16px;}
.contador .n{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:58px;line-height:1;color:var(--terra-d);min-width:44px;text-align:center;}
.contador b{display:block;font-size:15px;}
.contador span{font-size:13px;color:var(--muted);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pr{border:1px solid var(--border);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;justify-content:space-between;min-height:86px;}
.pr.ya{background:var(--card2);}
.pr-n{font-size:13.5px;font-weight:700;line-height:1.3;}
.pr.ya .pr-n{color:var(--muted);}
.est{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;width:fit-content;}
.est.disp{background:var(--terra-l);color:var(--terra-d);}
.est.ya{background:#fff;color:var(--muted);}
#mapa{height:240px;border-radius:14px;overflow:hidden;}
.vacio{border:1.5px dashed var(--border);border-radius:14px;padding:26px 14px;text-align:center;font-size:13px;color:var(--muted);background:var(--card2);}
.gan{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.gan:last-child{border-bottom:none;}
.gan-u{font-weight:700;color:var(--terra-d);word-break:break-word;}
.gan-p{color:var(--muted);text-align:right;}
.pie{text-align:center;margin-top:18px;font-size:12.5px;}
.pie a{color:var(--terra-d);}
.cargando{text-align:center;padding:70px 10px;color:var(--muted);}
</style>

      </div>
    </div>
    <p class="nota">${t('nota')}</p>
    <a class="link-c" href="tesoro.html">${t('ver_todos')}</a>`;
}
async function reclamar(){
  const inp=document.getElementById('igUser'),btn=document.getElementById('btnReclamar'),err=document.getElementById('err');
  const handle=inp.value.trim().replace(/^@+/,'');
  if(!handle){inp.classList.add('error-campo');inp.focus();return;}
  btn.disabled=true;btn.textContent=t('girando');err.innerHTML='';
  const [{data:pool},{data,error}]=await Promise.all([
    _sb.from('tesoro_ruleta').select('id,data').order('created_at',{ascending:true}),
    _sb.rpc('reclamar_premio',{p_id:stickerId,p_ig:handle,p_acepta:document.getElementById('acepto').checked,p_lang:_lang})
  ]);
  if(error||!data||data.error){
    const code=error?'error':(data?.error||'error');
    btn.disabled=false;btn.textContent=t('reclamar');
    if(code==='ya_reclamado'){err.innerHTML=`<div class="msg msg-err">${t('adelantaron')}</div><a class="link-c" href="tesoro.html">${t('qued')} →</a>`;btn.style.display='none';}
    else err.innerHTML=`<div class="msg msg-err">${t(['sin_premios','usuario_invalido','no_existe'].includes(code)?code:'error')}</div>`;
    return;
  }
  ev('reclamo',{sticker:stickerId,premio:data.premio});
  _ruleta=(pool||[]).filter(r=>r.data?.activo!==false);
  _res={premio:data.premio,premio_id:data.premio_id,ig:handle.toLowerCase(),girando:true};
  pintarGanador();
}
function cortar(txt,max){const w=String(txt).split(' ');const out=[];let l='';w.forEach(p=>{const s=l?l+' '+p:p;if(s.length>max&&l){out.push(l);l=p;}else l=s;});if(l)out.push(l);return out.slice(0,3);}
function pintarGanador(){
  const r=_res;
  const n=Math.max(_ruleta.length,1),sl=360/n,C=150,R=135;
  const pt=(a,rr)=>{const x=a*Math.PI/180;return[+(C+rr*Math.sin(x)).toFixed(2),+(C-rr*Math.cos(x)).toFixed(2)];};
  const segs=_ruleta.map((p,i)=>{
    const a0=i*sl,a1=(i+1)*sl,[x1,y1]=pt(a0,R),[x2,y2]=pt(a1,R),mid=a0+sl/2;
    const ls=cortar(p.data?.nombre||'',13);
    const txt=ls.map((l,k)=>`<text x="${C}" y="${C-R+30+k*13}" text-anchor="middle" class="rp-txt" font-size="10.5" fill="${i%2?'#FBF1E4':'#6B3A1E'}">${esc(l)}</text>`).join('');
    return`<path d="M${C} ${C}L${x1} ${y1}A${R} ${R} 0 ${sl>180?1:0} 1 ${x2} ${y2}Z" fill="${i%2?'#9A5C30':'#FBF1E4'}" stroke="#D9A54A" stroke-width="1.5"/><g transform="rotate(${mid} ${C} ${C})">${txt}</g>`;
  }).join('');
  const idx=Math.max(0,_ruleta.findIndex(p=>p.id===r.premio_id));
  const final=360*5+(360-(idx*sl+sl/2));
  const waTxt=t('wa_premio').replace('{p}',r.premio).replace('{id}',stickerId).replace('{ig}',r.ig);
  app.innerHTML=`<div class="cab"><div class="kicker">${t('kicker')}</div></div>
    <div class="card">
      <div class="rp"><div class="rp-pin"></div><svg viewBox="0 0 300 300"><g id="rpRot" style="transform:rotate(${r.girando?0:final}deg)">${segs}</g>
        <circle cx="150" cy="150" r="135" fill="none" stroke="#D9A54A" stroke-width="4"/><circle cx="150" cy="150" r="20" fill="#FBF1E4" stroke="#D9A54A" stroke-width="2"/></svg></div>
      <div id="fin" style="${r.girando?'display:none':''}">
        <div class="msg msg-ok">${t('ganaste').replace('{p}',esc(r.premio))}</div>
        <div class="recordar">${I.camara}<span>${t('recordar')}</span></div>
        <a class="btn btn-terra" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(waTxt)}" target="_blank" rel="noopener" onclick="ev('premio_whatsapp',{sticker:stickerId})">${t('coordinar')}</a>
      </div>
    </div>
    <a class="link-c" href="tesoro.html">${t('ver_todos')}</a>`;
  if(r.girando){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('rpRot').style.transform=`rotate(${final}deg)`;}));
    setTimeout(()=>{r.girando=false;const f=document.getElementById('fin');if(f)f.style.display='';if(navigator.vibrate)try{navigator.vibrate([30,60,30]);}catch(e){}},4200);
  }
}

/* ═══════════ TABLERO ═══════════ */
let _tb=null,_mapa=null;
async function vistaTablero(){
  if(!_tb){
    ev('page_view_tablero');
    const {data,error}=await _sb.rpc('tesoro_tablero');
    _tb=error?[]:(data||[]);
  }
  _vista=pintarTablero;pintarTablero();
}
function pintarTablero(){
  const L=_tb||[];
  const disp=L.filter(p=>!p.reclamado),gan=L.filter(p=>p.reclamado).sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
  const edicion=[...L].reverse().find(p=>p.edicion)?.edicion;
  const zonas=gan.filter(p=>p.zona_lat!=null&&p.zona_lng!=null);
  app.innerHTML=`<div class="cab"><h1>${t('tb_h1')}</h1><p>${t('tb_sub')}</p></div>
    <div class="dos">
      <a class="modo modo-a" href="ruleta.html" onclick="ev('click_ruleta')"><h3>${t('m1_t')}</h3><p>${t('m1_p')}</p></a>
      <div class="modo modo-b"><h3>${t('m2_t')}</h3><p>${t('m2_p')}</p></div>
    </div>
    <div class="card contador"><div class="n">${disp.length}</div><div><b>${t(disp.length===1?'escondido1':'escondidos')}</b><span>${edicion?t('edicion').replace('{e}',esc(edicion)):t('sin_edicion')}</span></div></div>
    <div class="card"><div class="sec-t">${t('premios')}</div>
      ${L.length?`<div class="grid">${L.map(p=>p.reclamado
        ?`<div class="pr ya"><div class="pr-n">${esc(p.premio_ganado||'—')}</div><span class="est ya">${t('reclamado')}</span></div>`
        :`<div class="pr"><div class="pr-n">${t('sorpresa')}</div><span class="est disp">${t('disponible')}</span></div>`).join('')}</div>`
        :`<div class="vacio">${t('sin_stickers')}</div>`}
    </div>
    <div class="card"><div class="sec-t">${t('donde')}</div>${zonas.length?'<div id="mapa"></div>':`<div class="vacio">${t('mapa_vacio')}</div>`}</div>
    <div class="card"><div class="sec-t">${t('ultimos')}</div>
      ${gan.length?gan.slice(0,8).map(p=>`<div class="gan"><span class="gan-u">${p.ganador?ig(p.ganador):t('alguien')}</span><span class="gan-p">${esc(p.premio_ganado||'')}</span></div>`).join(''):`<div style="font-size:13.5px;color:var(--muted)">${t('nadie')}</div>`}
    </div>
    <a class="btn btn-borde" href="https://wa.me/${WA_NUM}?text=${encodeURIComponent(t('wa_agendar'))}" target="_blank" rel="noopener" onclick="ev('agendar_whatsapp')">${t('agendar')}</a>
    <div class="pie"><a href="privacidad.html">${t('privacidad')}</a></div>`;
  if(zonas.length&&window.L)setTimeout(()=>dibujarMapa(zonas),0);
}
function dibujarMapa(zonas){
  if(_mapa){_mapa.remove();_mapa=null;}
  _mapa=window.L.map('mapa',{scrollWheelZoom:false});
  window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:16,attribution:'© OpenStreetMap'}).addTo(_mapa);
  // primero la vista (los círculos necesitan el mapa ya ubicado), después las zonas
  if(zonas.length===1)_mapa.setView([zonas[0].zona_lat,zonas[0].zona_lng],13);
  else _mapa.fitBounds(window.L.latLngBounds(zonas.map(z=>[z.zona_lat,z.zona_lng])).pad(.35),{maxZoom:13});
  zonas.forEach(z=>window.L.circle([z.zona_lat,z.zona_lng],{radius:650,color:'#9A5C30',weight:1.5,fillColor:'#C17A48',fillOpacity:.25})
    .bindTooltip(t('zona')).addTo(_mapa));
}

/* ═══════════ IDIOMA ═══════════ */
function setLang(l){
  if(!T[l])return;_lang=l;try{localStorage.setItem('jcc_lang',l);}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if(_res&&_res.girando)return;
  if(_vista)_vista();
}
setLang(_lang);
if(stickerId)vistaSticker();else vistaTablero();
